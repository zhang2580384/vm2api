# PR/main gate against the production baseline: deploy/payload.json pins the
# exact ELFs running live, so CI only checks source and the pinned bytes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Only PR runs supersede each other; every main push keeps its own verdict so
# it is visible when main turned red and when it recovered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # refs/pull/<n>/merge keeps the base from the PR's last push and a
          # re-run reuses it; merge today's base so a re-run tests against it.
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: npm ci
      - name: format and syntax
        run: |
          npx biome format
          test -z "$(gofmt -l worker api-kernel)" || { gofmt -l worker api-kernel; exit 1; }
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: pinned payload
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
      - name: Codex 6.2 kernel over loopback HTTP and WebSocket
        run: |
          fixture=$(mktemp -d)
          mkdir -p "$fixture/bin" "$fixture/deploy"
          cp -R src scripts test node_modules VERSION package.json "$fixture/"
          # The gateway writes its public startup snapshot; keep that output in the container tmpfs.
          ln -sf /tmp/gateway-v2.public.json "$fixture/src/config/gateway-v2.public.json"
          cp deploy/payload.json "$fixture/deploy/"
          cp bin/kin-codex-kernel "$fixture/bin/"
          CGO_ENABLED=0 go -C api-kernel build -o "$fixture/bin/kin-api-kernel" ./cmd/kin-api-kernel
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,mode=1777 -e HOME=/tmp \
            -v "$fixture:/project:ro" -w /project -e KIN_CODEX_TEST_BIN=/project/bin/kin-codex-kernel \
            -e KIN_API_KERNEL_BIN=/project/bin/kin-api-kernel node:22-bookworm-slim \
            node --test test/e2e/codex-62.e2e.test.mjs
      - run: npm run test:unit
      - name: offline backup and cloud restore end-to-end
        run: node --test test/e2e/backup.e2e.test.mjs test/e2e/panel-proxy-domain-forward.e2e.test.mjs
      - name: go vet and test
        run: |
          (cd worker && go vet ./... && go test ./...)
          (cd api-kernel && go vet ./... && go test ./...)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: offline account-login browser fixtures
        run: |
          python test/mailbox-display-test.py
          python test/mailbox-native-browser-test.py
          python test/quality-state-probe-test.py
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          xvfb-run --auto-servernum python test/codex-mailbox-browser-test.py
          python test/codex-registration-browser-test.py
          node --input-type=module -e "import {SLOT_SUPERVISOR} from './src/lib/oauth/codex-mailbox-runtime.mjs'; process.stdout.write(SLOT_SUPERVISOR)" > "$RUNNER_TEMP/mailbox-supervisor.py"
          MAILBOX_SUPERVISOR_SOURCE="$RUNNER_TEMP/mailbox-supervisor.py" python test/codex-mailbox-supervisor-test.py
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm test
          pnpm build
