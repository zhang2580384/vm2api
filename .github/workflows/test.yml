# PR/main gate against the production baseline: deploy/payload.json pins the
# exact ELFs running live, so CI only checks source and the pinned bytes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Only PR runs supersede each other; every main push keeps its own verdict so
# it is visible when main turned red and when it recovered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # refs/pull/<n>/merge keeps the base from the PR's last push and a
          # re-run reuses it; merge today's base so a re-run tests against it.
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: npm ci
      - name: format and syntax
        run: |
          npx biome format
          test -z "$(gofmt -l worker api-kernel)" || { gofmt -l worker api-kernel; exit 1; }
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: pinned payload
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
      - name: native CLI packaging unit tests
        run: python3 -m unittest discover -s test/deploy -p test_native_cli.py -v
      - run: npm run test:unit
      - name: offline backup and cloud restore end-to-end
        run: node --test test/e2e/backup.e2e.test.mjs test/e2e/panel-proxy-domain-forward.e2e.test.mjs
      - name: go vet and test
        run: |
          (cd worker && go vet ./... && go test ./...)
          (cd api-kernel && go vet ./... && go test ./...)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: offline account-login browser fixtures
        run: |
          python test/mailbox-display-test.py
          python test/mailbox-native-browser-test.py
          python test/quality-state-probe-test.py
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          xvfb-run --auto-servernum python test/codex-mailbox-browser-test.py
          python test/codex-registration-browser-test.py
          node --input-type=module -e "import {SLOT_SUPERVISOR} from './src/lib/oauth/codex-mailbox-runtime.mjs'; process.stdout.write(SLOT_SUPERVISOR)" > "$RUNNER_TEMP/mailbox-supervisor.py"
          MAILBOX_SUPERVISOR_SOURCE="$RUNNER_TEMP/mailbox-supervisor.py" python test/codex-mailbox-supervisor-test.py
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm test
          pnpm build

  arm64-native-cli:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: prepare pinned x86 kernel emulation
        run: python3 deploy/prepare-arm64.py
      - name: build native ARM control plane
        run: docker build -f deploy/Dockerfile.arm64-control -t vm2api-native-cli-ci .
      - name: offline large-body, concurrency and cancel regression
        run: |
          docker run --network none --cpus 2 --memory 3g --pids-limit 256 \
            --entrypoint python3 -v "$PWD/test/deploy/smoke_native_cli.py:/smoke.py:ro" \
            vm2api-native-cli-ci /smoke.py
