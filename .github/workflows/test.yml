# PR/main gate against the production baseline: deploy/payload.json pins the
# exact ELFs running live, so CI only checks source and the pinned bytes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Only PR runs supersede each other; every main push keeps its own verdict so
# it is visible when main turned red and when it recovered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # refs/pull/<n>/merge keeps the base from the PR's last push and a
          # re-run reuses it; merge today's base so a re-run tests against it.
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: npm ci
      - name: format and syntax
        run: |
          npx biome format
          test -z "$(gofmt -l worker api-kernel)" || { gofmt -l worker api-kernel; exit 1; }
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: pinned payload
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
      - name: native CLI packaging unit tests
        run: python3 -m unittest discover -s test/deploy -p test_native_cli.py -v
      - run: npm run test:unit
      - name: offline backup and cloud restore end-to-end
        run: node --test test/e2e/backup.e2e.test.mjs test/e2e/panel-proxy-domain-forward.e2e.test.mjs
      - name: protocol configuration and count-tokens HTTP compatibility
        run: node --test test/e2e/persona-migration.e2e.test.mjs
      - name: go vet and test
        run: |
          (cd worker && go vet ./... && go test ./...)
          (cd api-kernel && go vet ./... && go test ./...)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: offline account-login browser fixtures
        run: |
          python test/mailbox-display-test.py
          python test/mailbox-native-browser-test.py
          python test/quality-state-probe-test.py
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          xvfb-run --auto-servernum python test/codex-mailbox-browser-test.py
          python test/codex-registration-browser-test.py
          node --input-type=module -e "import {SLOT_SUPERVISOR} from './src/lib/oauth/codex-mailbox-runtime.mjs'; process.stdout.write(SLOT_SUPERVISOR)" > "$RUNNER_TEMP/mailbox-supervisor.py"
          MAILBOX_SUPERVISOR_SOURCE="$RUNNER_TEMP/mailbox-supervisor.py" python test/codex-mailbox-supervisor-test.py
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm test
          pnpm build

  protocol-native-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: worker/go.sum
      - run: npm ci
      - name: fetch and verify both exact payload baselines
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
          mkdir "$RUNNER_TEMP/previous-vm2api"
          git archive 3f883cba6b34fbee71d75de1e41c139767e2ddce | tar -x -C "$RUNNER_TEMP/previous-vm2api"
          node scripts/fetch-payload.mjs --manifest "$RUNNER_TEMP/previous-vm2api/deploy/payload.json" --dest "$RUNNER_TEMP/previous-vm2api"
          node scripts/fetch-payload.mjs --check --manifest "$RUNNER_TEMP/previous-vm2api/deploy/payload.json" --dest "$RUNNER_TEMP/previous-vm2api"
          cp bin/kin-kernel share/wrap-cli/kin-kernel.bin
          cp "$RUNNER_TEMP/previous-vm2api/bin/kin-kernel" "$RUNNER_TEMP/previous-vm2api/share/wrap-cli/kin-kernel.bin"
          mkdir -p "$RUNNER_TEMP/previous-vm2api/node_modules"
          mkdir "$RUNNER_TEMP/protocol-evidence"
          chmod 0777 "$RUNNER_TEMP/protocol-evidence"
      - name: build worker source without replacing the pinned artifact
        working-directory: worker
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/worker-from-source" ./cmd/kin-worker
      - name: offline pinned and rebuilt AMD64 worker OAuth contracts
        run: |
          docker run --rm --network none --read-only --user 1000:1000 --cpus 2 --memory 512m \
            --tmpfs /tmp:rw,exec,size=128m,uid=1000,gid=1000 \
            -v "$PWD:/candidate:ro" -v "$RUNNER_TEMP/worker-from-source:/worker-from-source:ro" \
            --entrypoint python3 python:3.12-slim \
            /candidate/test/deploy/smoke_worker_oauth.py /candidate/bin/kin-worker /worker-from-source \
            | tee "$RUNNER_TEMP/protocol-evidence/worker-amd64.log"
      - name: offline native HTTP and complete state rollback
        run: |
          docker run --rm --network none --read-only --user 1000:1000 --cpus 2 --memory 3g --pids-limit 512 \
            --tmpfs /tmp:rw,exec,size=2g,uid=1000,gid=1000 \
            -v "$PWD:/candidate:ro" -v "$RUNNER_TEMP/previous-vm2api:/previous:ro" \
            -v "$PWD/node_modules:/previous/node_modules:ro" \
            -v "$RUNNER_TEMP/protocol-evidence:/evidence:rw" \
            -w /candidate -e NODE_ENV=test -e KIN_PREVIOUS_SOURCE=/previous \
            -e KIN_303_KERNEL=/candidate/share/wrap-cli/kin-kernel \
            -e KIN_303_CLI=/candidate/share/wrap-cli/cli-node \
            -e KIN_PROTOCOL_EVIDENCE_DIR=/evidence \
            --entrypoint node node:22-bookworm-slim \
            --test --test-reporter=tap test/e2e/protocol-native-matrix.e2e.test.mjs test/e2e/protocol-rollback.e2e.test.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: protocol-native-evidence
          path: ${{ runner.temp }}/protocol-evidence
          if-no-files-found: ignore

  arm64-native-cli:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: prepare pinned x86 kernel emulation
        run: python3 deploy/prepare-arm64.py
      - name: build native ARM control plane
        run: docker build -f deploy/Dockerfile.arm64-control -t vm2api-native-cli-ci .
      - name: offline large-body, concurrency and cancel regression
        run: |
          docker run --network none --cpus 2 --memory 3g --pids-limit 256 \
            --entrypoint python3 -v "$PWD/test/deploy/smoke_native_cli.py:/smoke.py:ro" \
            vm2api-native-cli-ci /smoke.py
      - name: offline rebuilt ARM64 worker OAuth contracts
        run: |
          docker run --rm --network none --read-only --cpus 2 --memory 512m \
            --tmpfs /tmp:rw,exec,size=128m \
            --entrypoint python3 -v "$PWD/test/deploy/smoke_worker_oauth.py:/worker-smoke.py:ro" \
            vm2api-native-cli-ci /worker-smoke.py /opt/vm2api/image-bin/kin-worker
